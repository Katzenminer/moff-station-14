name: Integration Tests Experimental

# Experiment: does splitting Content.IntegrationTests across several parallel GitHub Actions jobs
# beat the current single-job run? The in-process NUnit LevelOfParallelism is pinned to 2
# (Content.IntegrationTests/AssemblyInfo.cs) because of a still-open .NET JIT lock-contention bug
# (https://github.com/dotnet/runtime/issues/107197) that shows up when many threads in the same
# process compile expression trees concurrently. That cap is per-process, not global, so running
# partitions as separate matrix jobs (separate runners, separate JITs) sidesteps it entirely instead
# of waiting on an upstream fix.
#
# The build runs once and its output is shared with every test job via an artifact, so the matrix
# only multiplies test time, not build time.
#
# One bucket per namespace: the "discover" job walks Content.IntegrationTests/Tests at run time and
# emits one matrix entry per top-level subfolder (= namespace, verified 1:1 with the folder layout),
# plus one "Root" entry for the loose top-level test files that aren't in any subfolder. Root's
# filter is the negation of every other namespace, so it's everything-else rather than an explicit
# list - nothing added later can fall through a gap between buckets. Being computed from the actual
# checked-out tree (not a hardcoded name list) also means the split never drifts from reality as
# folders are added, renamed, or removed.
#
# Triggered on push to this branch (and manually) rather than wired into build-test-debug.yml, so
# it can be evaluated in isolation without touching the real CI gate.

on:
  push:
    branches: [ Integration-Tests-Experimental ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Submodule
        run: git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration DebugOpt --no-restore -m

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: bin/
          retention-days: 1

  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate one matrix entry per namespace
        id: gen
        shell: bash
        run: |
          cd Content.IntegrationTests/Tests
          folders=$(find . -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)

          entries="[]"
          negation=""
          for f in $folders; do
            ns="Content.IntegrationTests.Tests.$f"
            filter="FullyQualifiedName~$ns."
            negation="${negation}FullyQualifiedName!~$ns.&"
            entries=$(echo "$entries" | jq --arg name "$f" --arg filter "$filter" '. + [{name:$name, filter:$filter}]')
          done

          # Root: the loose test files directly under Tests/ with no subfolder of their own -
          # "not in any of the namespaces above" instead of an explicit list.
          negation="${negation%&}"
          entries=$(echo "$entries" | jq --arg name "Root" --arg filter "$negation" '. + [{name:$name, filter:$filter}]')

          echo "Generated $(echo "$entries" | jq 'length') buckets"
          echo "matrix=$(echo "$entries" | jq -c .)" >> "$GITHUB_OUTPUT"

  integration-tests:
    needs: [ build, discover ]
    runs-on: ubuntu-latest
    # Generous for this first per-namespace run since there's no real per-bucket timing yet - the
    # previous hand-picked buckets showed the old 15-minute cap can genuinely get hit (Atmos alone
    # was part of a bucket that blew past it). Tighten once actual durations are known.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Submodule
        run: git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: bin/

      - name: Run Content.IntegrationTests (${{ matrix.name }})
        shell: pwsh
        run: |
          $env:DOTNET_gcServer=1
          $filter = '${{ matrix.filter }}'
          Write-Host "Namespace: ${{ matrix.name }}"
          Write-Host "Filter: $filter"
          dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter "$filter" -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

      - name: Archive NUnit3 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit3-results-${{ matrix.name }}
          path: test_results/*
          retention-days: 7
          compression-level: 9

  content-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Submodule
        run: git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: bin/

      - name: Run Content.Tests
        shell: pwsh
        run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0 NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

      - name: Archive NUnit3 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit3-results-content-tests
          path: test_results/*
          retention-days: 7
          compression-level: 9

  experimental-success:
    name: Integration Tests Experimental
    needs:
      - integration-tests
      - content-tests
    runs-on: ubuntu-latest
    steps:
      - name: Done
        run: exit 0
