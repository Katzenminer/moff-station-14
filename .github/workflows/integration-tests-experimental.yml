name: Integration Tests Experimental

# Experiment: does splitting Content.IntegrationTests across several parallel GitHub Actions jobs
# beat the current single-job run? The in-process NUnit LevelOfParallelism is pinned to 2
# (Content.IntegrationTests/AssemblyInfo.cs) because of a still-open .NET JIT lock-contention bug
# (https://github.com/dotnet/runtime/issues/107197) that shows up when many threads in the same
# process compile expression trees concurrently. That cap is per-process, not global, so running
# partitions as separate matrix jobs (separate runners, separate JITs) sidesteps it entirely instead
# of waiting on an upstream fix.
#
# The build runs once and its output is shared with every test job via an artifact, so the matrix
# only multiplies test time, not build time.
#
# Partitioning is by top-level folder under Content.IntegrationTests/Tests, bucketed by rough file
# count (a proxy for size, not measured runtime) into 3 explicit buckets plus a catch-all for
# everything else - including any new folder added later, so the split can't silently drop tests.
# Once this has run for real, use the per-job timings in the Actions UI to rebalance the buckets.
#
# Triggered on push to this branch (and manually) rather than wired into build-test-debug.yml, so
# it can be evaluated in isolation without touching the real CI gate.

on:
  push:
    branches: [ Integration-Tests-Experimental ]
  workflow_dispatch:

env:
  # Bucket 1-3 are explicit folder lists; bucket 4 is "none of the above" (De Morgan's of the same
  # list), so every test lands in exactly one bucket even if new folders show up later. Kept as
  # single-line scalars deliberately - a folded (">-") block scalar turns each line break into a
  # space, which would leave stray whitespace sitting next to the "|"/"&" operators.
  FILTER_1: "FullyQualifiedName~Content.IntegrationTests.Tests.Atmos.|FullyQualifiedName~Content.IntegrationTests.Tests.Construction.|FullyQualifiedName~Content.IntegrationTests.Tests.Chemistry."
  FILTER_2: "FullyQualifiedName~Content.IntegrationTests.Tests.GameRules.|FullyQualifiedName~Content.IntegrationTests.Tests.Interaction.|FullyQualifiedName~Content.IntegrationTests.Tests.Minds.|FullyQualifiedName~Content.IntegrationTests.Tests.Destructible."
  FILTER_3: "FullyQualifiedName~Content.IntegrationTests.Tests.GameTestTests.|FullyQualifiedName~Content.IntegrationTests.Tests.Body.|FullyQualifiedName~Content.IntegrationTests.Tests.Commands.|FullyQualifiedName~Content.IntegrationTests.Tests.Administration.|FullyQualifiedName~Content.IntegrationTests.Tests.Damageable."
  FILTER_4: "FullyQualifiedName!~Content.IntegrationTests.Tests.Atmos.&FullyQualifiedName!~Content.IntegrationTests.Tests.Construction.&FullyQualifiedName!~Content.IntegrationTests.Tests.Chemistry.&FullyQualifiedName!~Content.IntegrationTests.Tests.GameRules.&FullyQualifiedName!~Content.IntegrationTests.Tests.Interaction.&FullyQualifiedName!~Content.IntegrationTests.Tests.Minds.&FullyQualifiedName!~Content.IntegrationTests.Tests.Destructible.&FullyQualifiedName!~Content.IntegrationTests.Tests.GameTestTests.&FullyQualifiedName!~Content.IntegrationTests.Tests.Body.&FullyQualifiedName!~Content.IntegrationTests.Tests.Commands.&FullyQualifiedName!~Content.IntegrationTests.Tests.Administration.&FullyQualifiedName!~Content.IntegrationTests.Tests.Damageable."

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Submodule
        run: git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration DebugOpt --no-restore -m

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: bin/
          retention-days: 1

  integration-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: [ 1, 2, 3, 4 ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Submodule
        run: git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: bin/

      - name: Run Content.IntegrationTests (partition ${{ matrix.partition }})
        shell: pwsh
        run: |
          $env:DOTNET_gcServer=1
          $filters = @{
            "1" = "${{ env.FILTER_1 }}"
            "2" = "${{ env.FILTER_2 }}"
            "3" = "${{ env.FILTER_3 }}"
            "4" = "${{ env.FILTER_4 }}"
          }
          $filter = $filters["${{ matrix.partition }}"]
          Write-Host "Filter: $filter"
          dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter "$filter" -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

      - name: Archive NUnit3 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit3-results-partition-${{ matrix.partition }}
          path: test_results/*
          retention-days: 7
          compression-level: 9

  content-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Submodule
        run: git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: bin/

      - name: Run Content.Tests
        shell: pwsh
        run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0 NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

      - name: Archive NUnit3 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit3-results-content-tests
          path: test_results/*
          retention-days: 7
          compression-level: 9

  experimental-success:
    name: Integration Tests Experimental
    needs:
      - integration-tests
      - content-tests
    runs-on: ubuntu-latest
    steps:
      - name: Done
        run: exit 0
